services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lol
      POSTGRES_PASSWORD: lol
      POSTGRES_DB: lolstats
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Not used yet. Will hold rate-limit counters and the job queue for match ingestion.
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
