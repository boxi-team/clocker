server:
  port: ${PORT:3000}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:lol-stats-backend-java/.env[.properties]
  application:
    name: lol-stats-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lolstats}
    username: ${DB_USER:lol}
    password: ${DB_PASSWORD:lol}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    # Existing databases created by the old Node migrate script are adopted as-is (all DDL is IF NOT EXISTS).
    baseline-on-migrate: true
    validate-on-migrate: false
  jackson:
    default-property-inclusion: always
  web:
    resources:
      add-mappings: false

lol:
  # Protects POST /v1/admin/* (send it as the x-admin-token header)
  admin-token: ${ADMIN_TOKEN:}
  # From https://developer.riotgames.com (a dev key expires every 24 hours). Never expose it to the browser.
  riot-api-key: ${RIOT_API_KEY:}
  # Test hook: when set, requests go to {riot-base-url}/{host}{path}
  riot-base-url: ${RIOT_BASE_URL:}
  # Riot app limits per host as max:windowMs pairs. Defaults are the dev-key limits.
  riot-rate-limits: ${RIOT_RATE_LIMITS:20:1000,100:120000}
  locale: ${DDRAGON_LOCALE:en_US}
  ddragon-base: ${DDRAGON_BASE:https://ddragon.leagueoflegends.com}
  # Check Data Dragon on boot and hourly, and run the background job worker
  enable-cron: ${ENABLE_CRON:true}
  enable-worker: ${ENABLE_WORKER:true}
  worker-concurrency: ${WORKER_CONCURRENCY:2}
  # Share of matches for which the extra timeline call is made (skill order, starting items). 0 to 1.
  timeline-sample-rate: ${TIMELINE_SAMPLE_RATE:0.25}
  first-import-count: ${FIRST_IMPORT_COUNT:20}
  refresh-cooldown-seconds: ${REFRESH_COOLDOWN_SECONDS:120}
  low-sample-games: ${LOW_SAMPLE_GAMES:100}
  inbound-rate-limit: ${INBOUND_RATE_LIMIT:120}
  # Daily crawl (COL-22): imports new matches for every tier once a day so the win rates stay current.
  # Off by default. Set ENABLE_DAILY_CRAWL=true on ONE machine only (shared database).
  enable-daily-crawl: ${ENABLE_DAILY_CRAWL:false}
  daily-crawl-region: ${DAILY_CRAWL_REGION:eun1}
  daily-matches-per-tier: ${DAILY_MATCHES_PER_TIER:1000}
  # Per-tier daily targets. Tiers not listed use daily-matches-per-tier.
  daily-matches-overrides: "${DAILY_MATCHES_OVERRIDES:iron:500,bronze:1000,silver:1500,gold:1500,platinum:1500,emerald:1000,diamond:1000,master:1000,grandmaster:1000,challenger:1000}"
  # Spring cron: second minute hour day month weekday. Default: every day at 03:00.
  daily-crawl-cron: ${DAILY_CRAWL_CRON:0 0 3 * * *}
  # Leaderboard: top players per region and tier, refreshed every 30 minutes.
  # Off by default. Set ENABLE_LEADERBOARD=true on ONE machine only (shared database).
  enable-leaderboard: ${ENABLE_LEADERBOARD:false}
  leaderboard-regions: ${LEADERBOARD_REGIONS:euw1,eun1,na1,kr,br1,la1,oc1,tr1}
  leaderboard-size: ${LEADERBOARD_SIZE:100}
  leaderboard-cron: ${LEADERBOARD_CRON:0 */30 * * * *}