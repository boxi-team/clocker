openapi: 3.1.0
info:
  title: LoL Stats API
  version: 1.1.0
  description: |
    REST API for an op.gg / u.gg style League of Legends stats site.

    **Data layers**
    1. Static game data (champions, items, runes, summoner spells) from Riot Data Dragon, synced per patch.
    2. Raw ranked matches (Solo/Duo and Flex only) from the Riot API (account-v1, summoner-v4, league-v4, match-v5).
    3. Everything else (champion win/pick/ban rates, builds, matchups, tier list, player stats) is computed by this API from layer 2.

    **Conventions**
    - Every success response is `{ "data": ..., "meta": {...} }`. Every error is `{ "error": { "code", "message", "details?" } }`.
    - Rates (`winRate`, `pickRate`, `banRate`, `roleRate`) are fractions between 0 and 1.
    - `patch` is `major.minor` (e.g. `16.22`) or `latest` for analytics endpoints, and a full Data Dragon version (`16.22.1`) or `latest` for static endpoints.
    - `region` is the Riot platform code (e.g. `euw1`). Riot regional routing is handled internally.
    - Riot ID is split in two path segments, URL-encoded: `/players/euw1/Faker/KR1`.
    - Item, rune and summoner spell icons are not returned as URLs. Use the numeric ids with `/items`, `/runes`, `/summoner-spells`
      and Data Dragon image URLs (`https://ddragon.leagueoflegends.com/cdn/{version}/img/item/{itemId}.png`).
    - Analytics endpoints return empty structures (not errors) when there are no matches for the filter:
      `games: 0`, `recommended: null`, `alternatives: []`, `matchups: []`, `skillOrder: null`. The UI must handle these states.
    - Inbound rate limit per IP (default 120 requests/minute) returns 429 `RATE_LIMITED` with `Retry-After`.
servers:
  - url: http://localhost:3000/v1
tags:
  - name: Meta
  - name: Static
  - name: Champions
  - name: Players
  - name: Matches
  - name: Jobs
  - name: Admin

paths:
  /health:
    get:
      tags: [Meta]
      summary: Liveness and database check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean }

  /patches:
    get:
      tags: [Meta]
      summary: Synced game patches, newest first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Patch' }

  /patches/latest:
    get:
      tags: [Meta]
      summary: Latest synced patch, with what changed since the previous patch
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PatchDetail' }
        '503': { $ref: '#/components/responses/DataNotReady' }

  /patches/{version}:
    get:
      tags: [Meta]
      summary: One synced patch (full version, e.g. 16.22.1), with what changed since the previous patch
      parameters:
        - name: version
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PatchDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /items:
    get:
      tags: [Static]
      summary: Item definitions (Data Dragon item.json) for a patch
      description: Cached 1 hour. `data.data` is keyed by item id (string).
      parameters:
        - $ref: '#/components/parameters/StaticPatch'
      responses:
        '200': { $ref: '#/components/responses/StaticAsset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DataNotReady' }

  /runes:
    get:
      tags: [Static]
      summary: Rune trees (Data Dragon runesReforged.json) for a patch
      description: |
        Cached 1 hour. `data` is an array of trees (style id in `id`, `icon` is a path relative to
        `https://ddragon.leagueoflegends.com/cdn/img/`). Perk ids from builds match `slots[].runes[].id`.
      parameters:
        - $ref: '#/components/parameters/StaticPatch'
      responses:
        '200': { $ref: '#/components/responses/StaticAsset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DataNotReady' }

  /summoner-spells:
    get:
      tags: [Static]
      summary: Summoner spells (Data Dragon summoner.json) for a patch
      description: |
        Cached 1 hour. `data.data` is keyed by spell name (e.g. `SummonerFlash`). Builds return numeric ids,
        which match the `key` field (string) of each entry. Image: `https://ddragon.leagueoflegends.com/cdn/{version}/img/spell/{image.full}`.
      parameters:
        - $ref: '#/components/parameters/StaticPatch'
      responses:
        '200': { $ref: '#/components/responses/StaticAsset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DataNotReady' }

  /champions:
    get:
      tags: [Champions]
      summary: List champions (static data), ordered by name
      description: Cached 5 minutes.
      parameters:
        - $ref: '#/components/parameters/StaticPatch'
        - name: tag
          in: query
          schema: { type: string, enum: [Assassin, Fighter, Mage, Marksman, Support, Tank] }
        - name: search
          in: query
          description: Case-insensitive substring of the champion name.
          schema: { type: string, maxLength: 32 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChampionSummary' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/DataNotReady' }

  /champions/{idOrKey}:
    get:
      tags: [Champions]
      summary: Champion detail, raw Data Dragon (lore, stats, spells, passive, ALL skins including chromas)
      description: |
        Returns raw Data Dragon `passive`, `spells` and `skins`. `skins` contains every chroma
        (entries with `parentSkin`). For a UI use `/champions/{idOrKey}/full`, which returns cleaned data.
      parameters:
        - $ref: '#/components/parameters/IdOrKey'
        - $ref: '#/components/parameters/StaticPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/ChampionDetail' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DataNotReady' }

  /champions/{idOrKey}/full:
    get:
      tags: [Champions]
      summary: Everything for a champion page in one call (hero, abilities, clean skins, stats, build)
      description: |
        Static data is always taken from the latest synced Data Dragon version (returned as `meta.version`);
        there is no static `patch` parameter. The analytics filters (`patch`, `tier`, `queue`, `region`, `role`)
        apply to `stats` and `build`.

        `skins` excludes chromas and each entry has its own splash art (`num` 0 is the default skin, named after the champion).
        Ability descriptions have HTML stripped. `cooldown` is a slash-separated string per rank (e.g. `9/8/7/6/5`).

        `build` has the same shape as `/champions/{idOrKey}/builds`, without the champion and `vs` fields.
        For lane matchups call `/champions/{idOrKey}/matchups` separately.
      parameters:
        - $ref: '#/components/parameters/IdOrKey'
        - $ref: '#/components/parameters/Patch'
        - $ref: '#/components/parameters/Tier'
        - $ref: '#/components/parameters/Queue'
        - $ref: '#/components/parameters/RegionFilter'
        - $ref: '#/components/parameters/RoleFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/ChampionFull' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/AnalyticsMeta'
                      - type: object
                        required: [version]
                        properties:
                          version:
                            type: string
                            description: Data Dragon version used for all static image URLs.
                            examples: ['16.22.1']
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DataNotReady' }

  /champions/{idOrKey}/stats:
    get:
      tags: [Champions]
      summary: Win, pick and ban rate for a champion, overall and per role
      parameters:
        - $ref: '#/components/parameters/IdOrKey'
        - $ref: '#/components/parameters/Patch'
        - $ref: '#/components/parameters/Tier'
        - $ref: '#/components/parameters/Queue'
        - $ref: '#/components/parameters/RegionFilter'
        - $ref: '#/components/parameters/RoleFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/ChampionStats' }
                  meta: { $ref: '#/components/schemas/AnalyticsMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DataNotReady' }

  /champions/{idOrKey}/builds:
    get:
      tags: [Champions]
      summary: Recommended runes, summoner spells, boots, item slots, skill order and starting items
      description: |
        `role` defaults to the champion's most played role in the selected filter. When the champion has no games,
        `role` is null, `games` is 0 and every option group is `{ recommended: null, alternatives: [] }`.

        Option groups (`runes`, `summonerSpells`, `boots`, `coreSets`, and each entry of `itemSlots`) share one shape:
        `recommended` is the most played option and `alternatives` holds up to 2 further options that have at least
        `minGames` games (`max(50, 5% of games)`; item slots use 5% of their own `sampleSize`).

        `itemSlots` lists item columns in purchase order: `starting`, `core` (first three completed items),
        `fourth`, `fifth`, `sixth`. Slots except `starting` come from match timelines, which are only fetched for a
        sample of matches (`TIMELINE_SAMPLE_RATE`), so check each slot's `sampleSize`. `skillOrder` and `startingItems`
        also come from timelines and are `null` when no timeline data exists.

        Optional `vs` (champion id or key) limits the build to games where the lane opponent (same role, other team)
        played that champion. Few games are likely, so check `games`.
      parameters:
        - $ref: '#/components/parameters/IdOrKey'
        - $ref: '#/components/parameters/Patch'
        - $ref: '#/components/parameters/Tier'
        - $ref: '#/components/parameters/Queue'
        - $ref: '#/components/parameters/RegionFilter'
        - $ref: '#/components/parameters/RoleFilter'
        - name: vs
          in: query
          required: false
          description: Lane opponent champion (id like `Zed` or key like `238`). Unknown champion returns 404.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/ChampionBuilds' }
                  meta: { $ref: '#/components/schemas/AnalyticsMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DataNotReady' }

  /champions/{idOrKey}/matchups:
    get:
      tags: [Champions]
      summary: Win rate against each lane opponent in the same role
      description: |
        Rows are ordered by `games` descending. `winRate` is the win rate of the REQUESTED champion against that opponent:
        the lowest values are the champion's counters, the highest are the champions it is strong against.
        Sort and slice client-side. `minGames` defaults to 100, so low-volume filters return an empty list.
      parameters:
        - $ref: '#/components/parameters/IdOrKey'
        - $ref: '#/components/parameters/Patch'
        - $ref: '#/components/parameters/Tier'
        - $ref: '#/components/parameters/Queue'
        - $ref: '#/components/parameters/RegionFilter'
        - $ref: '#/components/parameters/RoleFilter'
        - $ref: '#/components/parameters/MinGames'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Matchups' }
                  meta: { $ref: '#/components/schemas/AnalyticsMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DataNotReady' }

  /tier-list:
    get:
      tags: [Champions]
      summary: Champions ranked by performance (one row per champion and role)
      description: |
        `score` is the lower bound of the 95% Wilson confidence interval of the win rate (0-100), so
        champions with few games are not ranked above champions with many. `rank` is the position after sorting.
        A champion can appear several times, once per role.
      parameters:
        - $ref: '#/components/parameters/Patch'
        - $ref: '#/components/parameters/Tier'
        - $ref: '#/components/parameters/Queue'
        - $ref: '#/components/parameters/RegionFilter'
        - $ref: '#/components/parameters/RoleFilter'
        - $ref: '#/components/parameters/MinGames'
        - name: sort
          in: query
          schema: { type: string, enum: [score, winRate, pickRate, banRate, games], default: score }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TierListEntry' }
                  meta: { $ref: '#/components/schemas/AnalyticsMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/DataNotReady' }

  /players/{region}/{gameName}/{tagLine}:
    get:
      tags: [Players]
      summary: Player profile and current ranks
      description: |
        Unknown players are fetched from Riot synchronously (profile and ranks only), stored, and a
        background job imports their recent ranked matches. `matchesStatus` tells the client whether to poll
        `GET /jobs/{jobId}`. Cached 30 seconds.
      parameters:
        - $ref: '#/components/parameters/Region'
        - $ref: '#/components/parameters/GameName'
        - $ref: '#/components/parameters/TagLine'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/PlayerProfile' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/DataNotReady' }

  /players/{region}/{gameName}/{tagLine}/refresh:
    post:
      tags: [Players]
      summary: Re-fetch profile, ranks and new matches ("Update" button)
      description: |
        Returns immediately with a job. The player must already be loaded (`GET` the profile first, otherwise 404).
        One refresh per player per `REFRESH_COOLDOWN_SECONDS` (default 120): during the cooldown the response is
        429 `REFRESH_COOLDOWN` with a `Retry-After` header. If a refresh job is already queued or running,
        that job is returned with 202.
      parameters:
        - $ref: '#/components/parameters/Region'
        - $ref: '#/components/parameters/GameName'
        - $ref: '#/components/parameters/TagLine'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /players/{region}/{gameName}/{tagLine}/matches:
    get:
      tags: [Players]
      summary: Stored ranked matches of a player, newest first
      description: The player must already be loaded (404 `PLAYER_NOT_FOUND` otherwise).
      parameters:
        - $ref: '#/components/parameters/Region'
        - $ref: '#/components/parameters/GameName'
        - $ref: '#/components/parameters/TagLine'
        - $ref: '#/components/parameters/Queue'
        - $ref: '#/components/parameters/PlayerChampionFilter'
        - $ref: '#/components/parameters/RoleFilter'
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/Count'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PlayerMatch' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /players/{region}/{gameName}/{tagLine}/stats:
    get:
      tags: [Players]
      summary: Aggregate stats of a player over stored matches
      parameters:
        - $ref: '#/components/parameters/Region'
        - $ref: '#/components/parameters/GameName'
        - $ref: '#/components/parameters/TagLine'
        - $ref: '#/components/parameters/Queue'
        - $ref: '#/components/parameters/PlayerPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/PlayerStats' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - type: object
                        description: '`patch` is null when no patch filter was given.'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /players/{region}/{gameName}/{tagLine}/champions:
    get:
      tags: [Players]
      summary: Player stats grouped by champion
      parameters:
        - $ref: '#/components/parameters/Region'
        - $ref: '#/components/parameters/GameName'
        - $ref: '#/components/parameters/TagLine'
        - $ref: '#/components/parameters/Queue'
        - $ref: '#/components/parameters/PlayerPatch'
        - $ref: '#/components/parameters/RoleFilter'
        - name: sort
          in: query
          schema: { type: string, enum: [games, winRate, kda], default: games }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PlayerChampionLine' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /players/{region}/{gameName}/{tagLine}/champions/{idOrKey}:
    get:
      tags: [Players]
      summary: Player stats on one champion, with their most used keystones and items
      parameters:
        - $ref: '#/components/parameters/Region'
        - $ref: '#/components/parameters/GameName'
        - $ref: '#/components/parameters/TagLine'
        - $ref: '#/components/parameters/IdOrKey'
        - $ref: '#/components/parameters/Queue'
        - $ref: '#/components/parameters/PlayerPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/PlayerChampionDetail' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /matches/{region}/{matchId}:
    get:
      tags: [Matches]
      summary: Full match with both teams
      description: |
        Served from the database; fetched from Riot and stored on first request. Only ranked Solo/Duo and Flex
        matches (not remakes) are supported. The match id prefix must belong to `region`. Cached 1 hour.
      parameters:
        - $ref: '#/components/parameters/Region'
        - name: matchId
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z0-9]+_[0-9]+$', examples: [EUW1_7123456789] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/MatchDetail' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Not a ranked Solo/Duo or Flex match, or a remake (`UNSUPPORTED_MATCH`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  /jobs/{jobId}:
    get:
      tags: [Jobs]
      summary: Status of a background job
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/sync:
    post:
      tags: [Admin]
      summary: Sync static data from Data Dragon
      description: Never call from a browser. Requires the `x-admin-token` header.
      security: [{ AdminToken: [] }]
      parameters:
        - name: force
          in: query
          description: Re-download even if the patch is already stored.
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
        - name: version
          in: query
          description: Full Data Dragon version to back-fill (e.g. `16.21.1`). Defaults to the latest.
          schema: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [patch, synced, champions]
                    properties:
                      patch: { type: string, examples: ['16.22.1'] }
                      synced: { type: boolean }
                      champions: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/crawl:
    post:
      tags: [Admin]
      summary: Seed match data by crawling a ranked ladder
      description: |
        Never call from a browser. Pages through league-v4 entries for a tier, then imports `matchesPerPlayer`
        recent ranked matches for each player. Matches are stored with the crawled tier as their `tierBucket`.
        `division` is required for iron through diamond and ignored for master, grandmaster and challenger.
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region, tier]
              properties:
                region: { $ref: '#/components/schemas/Region' }
                queue: { $ref: '#/components/schemas/Queue' }
                tier: { $ref: '#/components/schemas/TierBucket' }
                division: { type: string, enum: [I, II, III, IV] }
                pages: { type: integer, minimum: 1, maximum: 20, default: 1 }
                matchesPerPlayer: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    AdminToken:
      type: apiKey
      in: header
      name: x-admin-token

  parameters:
    Region:
      name: region
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Region' }
    GameName:
      name: gameName
      in: path
      required: true
      description: Riot ID name part, URL-encoded (1-16 characters).
      schema: { type: string, minLength: 1, maxLength: 16 }
    TagLine:
      name: tagLine
      in: path
      required: true
      description: Riot ID tag part, without the `#` (1-5 characters).
      schema: { type: string, minLength: 1, maxLength: 5 }
    IdOrKey:
      name: idOrKey
      in: path
      required: true
      description: Data Dragon id (`Ahri`, case-insensitive) or numeric champion key (`103`).
      schema: { type: string, examples: [Ahri, '103'] }
    StaticPatch:
      name: patch
      in: query
      description: Full Data Dragon version (`16.22.1`) or `latest`.
      schema: { type: string, default: latest }
    Patch:
      name: patch
      in: query
      description: '`major.minor` (e.g. `16.22`) or `latest`.'
      schema: { type: string, default: latest }
    PlayerPatch:
      name: patch
      in: query
      description: '`major.minor`. Omit for all stored matches.'
      schema: { type: string, pattern: '^[0-9]+\.[0-9]+$' }
    Tier:
      name: tier
      in: query
      description: Rank bucket of the match. `*_plus` aliases include higher tiers.
      schema:
        type: string
        enum: [all, iron, bronze, silver, gold, platinum, emerald, diamond, master, grandmaster, challenger, emerald_plus, diamond_plus, master_plus]
        default: master_plus
    Queue:
      name: queue
      in: query
      schema: { $ref: '#/components/schemas/Queue' }
    RegionFilter:
      name: region
      in: query
      description: Restrict to one platform region, or `all`.
      schema:
        oneOf:
          - { $ref: '#/components/schemas/Region' }
          - { type: string, const: all }
        default: all
    RoleFilter:
      name: role
      in: query
      schema: { $ref: '#/components/schemas/Role' }
    MinGames:
      name: minGames
      in: query
      description: Hide rows with fewer games than this.
      schema: { type: integer, minimum: 1, default: 100 }
    PlayerChampionFilter:
      name: championId
      in: query
      description: Champion key (`103`) or id (`Ahri`).
      schema: { type: string }
    Start:
      name: start
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Count:
      name: count
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: A parameter is missing or invalid (`INVALID_PARAMETER`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or wrong admin token (`UNAUTHORIZED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found (`CHAMPION_NOT_FOUND`, `PLAYER_NOT_FOUND`, `MATCH_NOT_FOUND`, `JOB_NOT_FOUND`, `NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: |
        Too many requests (`RATE_LIMITED`) or refresh cooldown active (`REFRESH_COOLDOWN`).
        Includes a `Retry-After` header in seconds.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UpstreamError:
      description: Riot API failed or the Riot key is invalid/expired (`UPSTREAM_ERROR`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DataNotReady:
      description: No data synced yet (`DATA_NOT_READY`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StaticAsset:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                description: Raw Data Dragon payload.
              meta: { $ref: '#/components/schemas/Meta' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - INVALID_PARAMETER
                - UNAUTHORIZED
                - CHAMPION_NOT_FOUND
                - PLAYER_NOT_FOUND
                - MATCH_NOT_FOUND
                - JOB_NOT_FOUND
                - NOT_FOUND
                - UNSUPPORTED_MATCH
                - RATE_LIMITED
                - REFRESH_COOLDOWN
                - DATA_NOT_READY
                - UPSTREAM_ERROR
                - INTERNAL
            message: { type: string }
            details:
              description: For `INVALID_PARAMETER`, usually `[{ path, message }]`.

    Region:
      type: string
      enum: [br1, eun1, euw1, jp1, kr, la1, la2, me1, na1, oc1, ph2, ru, sg2, th2, tr1, tw2, vn2]
    Role:
      type: string
      enum: [top, jungle, mid, adc, support]
    Queue:
      type: string
      description: ranked_solo = queue 420, ranked_flex = queue 440.
      enum: [ranked_solo, ranked_flex]
      default: ranked_solo
    TierBucket:
      type: string
      enum: [iron, bronze, silver, gold, platinum, emerald, diamond, master, grandmaster, challenger]

    Meta:
      type: object
      required: [generatedAt]
      properties:
        patch: { type: [string, 'null'] }
        generatedAt: { type: string, format: date-time }
    AnalyticsMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required: [patch, tier, queue, region, totalMatches]
          properties:
            tier: { type: string }
            queue: { $ref: '#/components/schemas/Queue' }
            region: { type: string }
            totalMatches:
              type: integer
              description: Matches in the selected filter (patch, queue, tier, region). Denominator of pick and ban rate.
    PageMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required: [start, count, total]
          properties:
            start: { type: integer }
            count: { type: integer }
            total: { type: integer }

    Patch:
      type: object
      required: [version, locale, syncedAt]
      properties:
        version: { type: string, examples: ['16.22.1'] }
        locale: { type: string }
        syncedAt: { type: string, format: date-time }

    PatchDetail:
      allOf:
        - $ref: '#/components/schemas/Patch'
        - type: object
          required: [changes]
          properties:
            changes:
              description: Differences against the previous synced patch; null for the oldest synced patch.
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/PatchChanges'

    PatchChanges:
      type: object
      required: [previousVersion, champions, items]
      properties:
        previousVersion: { type: string, examples: ['16.21.1'] }
        champions: { $ref: '#/components/schemas/Diff' }
        items: { $ref: '#/components/schemas/Diff' }

    Diff:
      type: object
      required: [added, removed, changed]
      properties:
        added:   { type: array, items: { $ref: '#/components/schemas/EntityRef' } }
        removed: { type: array, items: { $ref: '#/components/schemas/EntityRef' } }
        changed:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/EntityRef'
              - type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items:
                      type: object
                      required: [field, from, to]
                      properties:
                        field: { type: string, examples: ['stats.hp', 'gold.total', 'spells.Q.cooldownBurn'] }
                        from: {}
                        to: {}

    EntityRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, description: Champion key or item id }
        name: { type: string }

    ChampionSummary:
      type: object
      required: [key, id, name, title, tags, iconUrl, splashUrl]
      properties:
        key: { type: integer, examples: [103] }
        id: { type: string, examples: [Ahri] }
        name: { type: string }
        title: { type: string }
        blurb: { type: string }
        tags: { type: array, items: { type: string } }
        partype: { type: string, description: 'Resource type, e.g. Mana, Energy.' }
        info:
          type: object
          properties:
            attack: { type: integer }
            defense: { type: integer }
            magic: { type: integer }
            difficulty: { type: integer }
        stats:
          type: object
          description: Base stats from Data Dragon (hp, mp, armor, attackdamage, movespeed, per-level values, ...).
          additionalProperties: { type: number }
        iconUrl: { type: string, format: uri }
        splashUrl: { type: string, format: uri }
    ChampionDetail:
      allOf:
        - $ref: '#/components/schemas/ChampionSummary'
        - type: object
          properties:
            lore: { type: string }
            passive: { type: object, description: Raw Data Dragon passive (description contains HTML). }
            spells: { type: array, items: { type: object }, description: Raw Data Dragon spells (Q, W, E, R). }
            skins:
              type: array
              description: Raw Data Dragon skins including chromas (`parentSkin` set). Prefer `/full`.
              items: { type: object }

    FullSkin:
      type: object
      required: [num, name, splashUrl]
      properties:
        num: { type: integer, description: Skin number, 0 = default skin. }
        name: { type: string }
        splashUrl: { type: string, format: uri }
    FullAbility:
      type: object
      required: [name, description, iconUrl]
      properties:
        key: { type: [string, 'null'], enum: [Q, W, E, R, null] }
        name: { type: string }
        description: { type: string }
        cooldown: { type: [string, 'null'], description: 'Per-rank cooldown, slash separated, e.g. "9/8/7/6/5".', examples: ['7', '140/120/100'] }
        iconUrl: { type: string, format: uri }
    ChampionFull:
      type: object
      required: [key, id, name, title, tags, iconUrl, splashUrl, skins, abilities, stats, build]
      properties:
        key: { type: integer }
        id: { type: string }
        name: { type: string }
        title: { type: string }
        tags: { type: array, items: { type: string } }
        iconUrl: { type: string, format: uri }
        splashUrl: { type: string, format: uri }
        skins:
          type: array
          description: Skins without chromas, each with its own splash art. Use for a skin carousel.
          items: { $ref: '#/components/schemas/FullSkin' }
        abilities:
          type: object
          required: [passive, spells]
          properties:
            passive:
              type: object
              required: [name, description, iconUrl]
              properties:
                name: { type: string }
                description: { type: string }
                iconUrl: { type: string, format: uri }
            spells:
              type: array
              minItems: 4
              maxItems: 4
              items: { $ref: '#/components/schemas/FullAbility' }
        stats: { $ref: '#/components/schemas/ChampionOverallStats' }
        build: { $ref: '#/components/schemas/BuildCore' }

    StatLine:
      type: object
      required: [games, wins, winRate, kda, avgKills, avgDeaths, avgAssists, csPerMin, avgGold, avgDamageToChampions, avgVisionScore]
      properties:
        games: { type: integer }
        wins: { type: integer }
        winRate: { type: number, minimum: 0, maximum: 1 }
        kda: { type: number, description: '(total kills + total assists) / max(1, total deaths)' }
        avgKills: { type: number }
        avgDeaths: { type: number }
        avgAssists: { type: number }
        csPerMin: { type: number, description: 'total cs / total minutes played' }
        avgGold: { type: number }
        avgDamageToChampions: { type: number }
        avgVisionScore: { type: number }

    ChampionOverallStats:
      allOf:
        - $ref: '#/components/schemas/StatLine'
        - type: object
          required: [pickRate, banRate, lowSample]
          properties:
            pickRate: { type: number, description: games / totalMatches }
            banRate: { type: number, description: matches where banned / totalMatches }
            lowSample: { type: boolean, description: true when games < LOW_SAMPLE_GAMES (default 100) }

    ChampionStats:
      type: object
      required: [championKey, championId, overall, byRole]
      properties:
        championKey: { type: integer }
        championId: { type: string }
        overall: { $ref: '#/components/schemas/ChampionOverallStats' }
        byRole:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/StatLine'
              - type: object
                required: [role, pickRate, roleRate, lowSample]
                properties:
                  role: { $ref: '#/components/schemas/Role' }
                  pickRate: { type: number, description: games in role / all games in that role }
                  roleRate: { type: number, description: games in role / all games of this champion }
                  lowSample: { type: boolean }

    Rate:
      type: object
      required: [games, winRate, pickRate]
      properties:
        games: { type: integer }
        winRate: { type: number }
        pickRate: { type: number, description: 'games / reference games (the build `games`, or the slot `sampleSize` for item slots)' }

    RuneOption:
      allOf:
        - $ref: '#/components/schemas/Rate'
        - type: object
          required: [primaryStyle, subStyle, keystone, primaryPerks, secondaryPerks, statShards]
          properties:
            primaryStyle: { type: integer, description: Rune tree id (matches `id` in /runes). }
            subStyle: { type: integer }
            keystone: { type: integer, description: Perk id of the keystone (first of primaryPerks). }
            primaryPerks: { type: array, items: { type: integer }, description: 'Keystone + 3 perks of the primary tree.' }
            secondaryPerks: { type: array, items: { type: integer } }
            statShards: { type: array, items: { type: integer }, description: '[offense, flex, defense]' }
    SpellOption:
      allOf:
        - $ref: '#/components/schemas/Rate'
        - type: object
          required: [spellIds]
          properties:
            spellIds: { type: array, items: { type: integer }, minItems: 2, maxItems: 2, description: Sorted ascending. Match the `key` field in /summoner-spells. }
    BootsOption:
      allOf:
        - $ref: '#/components/schemas/Rate'
        - type: object
          required: [itemId]
          properties:
            itemId: { type: integer }
    ItemOption:
      allOf:
        - $ref: '#/components/schemas/Rate'
        - type: object
          required: [itemId]
          properties:
            itemId: { type: integer }
    ItemSetOption:
      allOf:
        - $ref: '#/components/schemas/Rate'
        - type: object
          required: [itemIds]
          properties:
            itemIds: { type: array, items: { type: integer }, description: Item ids of the set (3 for coreSets and the core slot, 1 for later slots, variable for starting items). }

    OptionGroup:
      description: Most played option plus up to 2 alternatives. When there is no data, `recommended` is null and `alternatives` is empty.
      type: object
      required: [recommended, alternatives]
      properties:
        recommended:
          oneOf: [{ type: 'null' }, {}]
        alternatives:
          type: array
          items: {}
    RuneGroup:
      allOf:
        - $ref: '#/components/schemas/OptionGroup'
        - type: object
          properties:
            recommended:
              oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/RuneOption' }]
            alternatives:
              type: array
              items: { $ref: '#/components/schemas/RuneOption' }
    SpellGroup:
      allOf:
        - $ref: '#/components/schemas/OptionGroup'
        - type: object
          properties:
            recommended:
              oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/SpellOption' }]
            alternatives:
              type: array
              items: { $ref: '#/components/schemas/SpellOption' }
    BootsGroup:
      allOf:
        - $ref: '#/components/schemas/OptionGroup'
        - type: object
          properties:
            recommended:
              oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/BootsOption' }]
            alternatives:
              type: array
              items: { $ref: '#/components/schemas/BootsOption' }
    CoreSetGroup:
      allOf:
        - $ref: '#/components/schemas/OptionGroup'
        - type: object
          properties:
            recommended:
              oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/ItemSetOption' }]
            alternatives:
              type: array
              items: { $ref: '#/components/schemas/ItemSetOption' }
    ItemSlot:
      allOf:
        - $ref: '#/components/schemas/CoreSetGroup'
        - type: object
          required: [slot, sampleSize]
          properties:
            slot:
              type: string
              enum: [starting, core, fourth, fifth, sixth]
              description: |
                Purchase-order column. `starting` = items bought in the first 90s, `core` = first three completed items,
                `fourth`..`sixth` = single completed items. Always returned in this order.
            sampleSize:
              type: integer
              description: Games with timeline data that reached this slot. Denominator of the slot's `pickRate`. Often small, show it.

    BuildCore:
      type: object
      required: [role, games, winRate, runes, summonerSpells, boots, itemSlots, items, coreSets, skillOrder, startingItems]
      properties:
        role:
          oneOf: [{ $ref: '#/components/schemas/Role' }, { type: 'null' }]
          description: Resolved role. null when there is no data (then everything below is empty).
        games: { type: integer }
        winRate: { type: number }
        minGames:
          type: integer
          description: 'Minimum games for an alternative to be listed: max(50, 5% of games). Absent when role is null.'
        runes: { $ref: '#/components/schemas/RuneGroup' }
        summonerSpells: { $ref: '#/components/schemas/SpellGroup' }
        boots: { $ref: '#/components/schemas/BootsGroup' }
        itemSlots:
          type: array
          description: starting, core, fourth, fifth, sixth. Empty array when there is no data.
          items: { $ref: '#/components/schemas/ItemSlot' }
        items:
          type: array
          description: Top 12 completed non-boots items in the final inventory, per item, by games.
          items: { $ref: '#/components/schemas/ItemOption' }
        coreSets:
          description: The three most expensive completed items of the final inventory, as a set (final inventory, not purchase order).
          allOf: [{ $ref: '#/components/schemas/CoreSetGroup' }]
        skillOrder:
          oneOf:
            - type: 'null'
            - type: object
              required: [sampleSize, orders]
              properties:
                sampleSize: { type: integer }
                orders:
                  type: array
                  items:
                    type: object
                    required: [maxOrder, sequence, games, winRate]
                    properties:
                      maxOrder: { type: string, examples: ['Q>E>W'], description: Order in which Q, W, E reach level 5. }
                      sequence: { type: string, examples: ['QWEQQRQEQEREEWW'], description: Most common first 15 skill-ups for that max order. Letters are Q, W, E, R. }
                      games: { type: integer }
                      winRate: { type: number }
        startingItems:
          oneOf:
            - type: 'null'
            - type: object
              required: [sampleSize, sets]
              properties:
                sampleSize: { type: integer }
                sets:
                  type: array
                  items:
                    type: object
                    required: [itemIds, games, winRate]
                    properties:
                      itemIds: { type: array, items: { type: integer } }
                      games: { type: integer }
                      winRate: { type: number }

    ChampionBuilds:
      allOf:
        - type: object
          required: [championKey, championId, vsChampionKey, vsChampionId]
          properties:
            championKey: { type: integer }
            championId: { type: string }
            vsChampionKey: { type: [integer, 'null'], description: Opponent key when `vs` was given, else null. }
            vsChampionId: { type: [string, 'null'], description: Opponent id when `vs` was given, else null. }
        - $ref: '#/components/schemas/BuildCore'

    Matchups:
      type: object
      required: [championKey, championId, role, matchups]
      properties:
        championKey: { type: integer }
        championId: { type: string }
        role:
          oneOf: [{ $ref: '#/components/schemas/Role' }, { type: 'null' }]
          description: Resolved role (the champion's most played one unless `role` was given). null when there is no data.
        matchups:
          type: array
          description: Ordered by games descending. Empty when no opponent reaches `minGames`.
          items:
            type: object
            required: [opponentKey, opponentId, games, wins, winRate]
            properties:
              opponentKey: { type: integer }
              opponentId: { type: string, description: 'Data Dragon id, used for champion icon URLs. Falls back to the numeric key as a string if the champion is unknown.' }
              games: { type: integer }
              wins: { type: integer }
              winRate: { type: number, description: Win rate of the requested champion against this opponent. }

    TierListEntry:
      type: object
      required: [rank, championKey, championId, name, role, games, winRate, pickRate, banRate, score, iconUrl]
      properties:
        rank: { type: integer }
        championKey: { type: integer }
        championId: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        games: { type: integer }
        winRate: { type: number }
        pickRate: { type: number, description: games in role / all games in that role }
        banRate: { type: number }
        score: { type: number, description: Wilson lower bound of win rate, 0-100. }
        iconUrl: { type: string, format: uri }

    RankEntry:
      type: object
      required: [queue, tier, division, leaguePoints, wins, losses, winRate]
      properties:
        queue: { $ref: '#/components/schemas/Queue' }
        tier: { type: string, examples: [EMERALD] }
        division: { type: string, examples: [II], description: Roman numeral; not meaningful for master+. }
        leaguePoints: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        winRate: { type: number }
    PlayerProfile:
      type: object
      required: [puuid, region, gameName, tagLine, summonerLevel, profileIconId, profileIconUrl, ranked, matchesStatus, matchesIndexed]
      properties:
        puuid: { type: string }
        region: { $ref: '#/components/schemas/Region' }
        gameName: { type: string }
        tagLine: { type: string }
        summonerLevel: { type: integer }
        profileIconId: { type: integer }
        profileIconUrl: { type: string, format: uri }
        ranked:
          type: array
          description: Empty for unranked players.
          items: { $ref: '#/components/schemas/RankEntry' }
        matchesStatus:
          type: string
          enum: [pending, ready, empty]
          description: pending = import job queued or running (poll /jobs/{jobId}), ready = matches stored, empty = nothing found.
        matchesIndexed: { type: integer }
        jobId:
          type: [string, 'null']
          format: uuid
          description: Active import job, if any.
        lastRefreshedAt: { type: [string, 'null'], format: date-time }

    PlayerMatch:
      type: object
      required: [matchId, queue, patch, gameCreation, gameDuration, win, championKey, role, kills, deaths, assists, cs, csPerMin, gold, damageToChampions, visionScore, items, summonerSpells, keystone]
      properties:
        matchId: { type: string }
        queue: { $ref: '#/components/schemas/Queue' }
        patch: { type: string }
        gameCreation: { type: integer, description: Unix ms. }
        gameDuration: { type: integer, description: Seconds. }
        win: { type: boolean }
        championKey: { type: integer }
        championId: { type: [string, 'null'] }
        role: { oneOf: [{ $ref: '#/components/schemas/Role' }, { type: 'null' }] }
        kills: { type: integer }
        deaths: { type: integer }
        assists: { type: integer }
        cs: { type: integer }
        csPerMin: { type: number }
        gold: { type: integer }
        damageToChampions: { type: integer }
        visionScore: { type: integer }
        champLevel: { type: integer }
        items: { type: array, items: { type: integer }, minItems: 7, maxItems: 7, description: 'Slots 0-5 plus trinket. 0 = empty.' }
        summonerSpells: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
        keystone: { type: [integer, 'null'] }

    RoleStatLine:
      allOf:
        - $ref: '#/components/schemas/StatLine'
        - type: object
          required: [role]
          properties:
            role: { $ref: '#/components/schemas/Role' }
    PlayerStats:
      type: object
      required: [summary, byRole, last20]
      properties:
        summary: { $ref: '#/components/schemas/StatLine' }
        byRole:
          type: array
          items: { $ref: '#/components/schemas/RoleStatLine' }
        last20:
          type: object
          required: [games, wins, winRate]
          properties:
            games: { type: integer }
            wins: { type: integer }
            winRate: { type: number }
    PlayerChampionLine:
      allOf:
        - $ref: '#/components/schemas/StatLine'
        - type: object
          required: [championKey, championId, name, iconUrl]
          properties:
            championKey: { type: integer }
            championId: { type: [string, 'null'] }
            name: { type: [string, 'null'] }
            iconUrl: { type: [string, 'null'], format: uri }
    PlayerChampionDetail:
      type: object
      required: [championKey, championId, summary, byRole, topKeystones, topItems]
      properties:
        championKey: { type: integer }
        championId: { type: string }
        summary: { $ref: '#/components/schemas/StatLine' }
        byRole:
          type: array
          items: { $ref: '#/components/schemas/RoleStatLine' }
        topKeystones:
          type: array
          description: Up to 3.
          items:
            type: object
            required: [keystone, games, winRate]
            properties:
              keystone: { type: integer }
              games: { type: integer }
              winRate: { type: number }
        topItems:
          type: array
          description: Up to 8 completed items.
          items:
            type: object
            required: [itemId, games, winRate]
            properties:
              itemId: { type: integer }
              games: { type: integer }
              winRate: { type: number }

    MatchParticipant:
      type: object
      required: [puuid, championKey, role, win, kills, deaths, assists, cs, gold, damageToChampions, visionScore, champLevel, items, summonerSpells, runes]
      properties:
        puuid: { type: string }
        gameName: { type: [string, 'null'] }
        tagLine: { type: [string, 'null'] }
        championKey: { type: integer }
        championId: { type: [string, 'null'] }
        role: { oneOf: [{ $ref: '#/components/schemas/Role' }, { type: 'null' }] }
        win: { type: boolean }
        kills: { type: integer }
        deaths: { type: integer }
        assists: { type: integer }
        cs: { type: integer }
        gold: { type: integer }
        damageToChampions: { type: integer }
        visionScore: { type: integer }
        champLevel: { type: integer }
        items: { type: array, items: { type: integer }, minItems: 7, maxItems: 7 }
        summonerSpells: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
        runes:
          type: object
          required: [primaryStyle, subStyle, keystone, primaryPerks, secondaryPerks, statShards]
          properties:
            primaryStyle: { type: [integer, 'null'] }
            subStyle: { type: [integer, 'null'] }
            keystone: { type: [integer, 'null'] }
            primaryPerks: { type: array, items: { type: integer } }
            secondaryPerks: { type: array, items: { type: integer } }
            statShards: { type: array, items: { type: integer } }
    MatchDetail:
      type: object
      required: [matchId, region, queue, patch, gameCreation, gameDuration, winningTeamId, tierBucket, teams]
      properties:
        matchId: { type: string }
        region: { $ref: '#/components/schemas/Region' }
        queue: { $ref: '#/components/schemas/Queue' }
        patch: { type: string }
        gameCreation: { type: integer }
        gameDuration: { type: integer }
        winningTeamId: { type: integer, enum: [100, 200] }
        tierBucket:
          type: string
          description: Rank of the player this match was discovered through, or `unranked`. An approximation of the lobby rank.
        teams:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            required: [teamId, win, bans, participants]
            properties:
              teamId: { type: integer, enum: [100, 200] }
              win: { type: boolean }
              bans: { type: array, items: { type: integer }, description: Banned champion keys in pick-turn order. }
              participants:
                type: array
                description: Ordered top, jungle, mid, adc, support.
                items: { $ref: '#/components/schemas/MatchParticipant' }

    Job:
      type: object
      required: [id, type, status, progress, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [player_refresh, crawl] }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        progress:
          type: object
          required: [done, total]
          properties:
            done: { type: integer }
            total: { type: integer }
        result: { type: [object, 'null'] }
        error: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }